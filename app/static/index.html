<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requirement &amp; Scoping Tool</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#5d6b7c; --line:#e1e5ea; --accent:#1f5eff; --ok:#12805c; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f141b; --card:#171e27; --text:#e8edf3; --muted:#93a1b3; --line:#2a3441; --accent:#6f9bff; --ok:#43c59e; --warn:#f0a53a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  textarea { width:100%; min-height:170px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 16px; font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:wait; }
  input[type=text] { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .flag { color:var(--warn); border-color:var(--warn); } .good { color:var(--ok); }
  .meta { color:var(--muted); font-size:13px; } pre { white-space:pre-wrap; margin:0; font:13px/1.6 ui-monospace,Menlo,Consolas,monospace; }
  #err { color:#d33; margin-top:10px; } .hide { display:none; }
  .wrap { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>Requirement &amp; Scoping Tool</h1>
  <p class="sub">Paste a call transcript or RFP text, or upload an RFP PDF. Get requirements, open questions and an estimating checklist.</p>

  <div class="card">
    <textarea id="text" placeholder="Paste text here..."></textarea>
    <div class="row">
      <input type="text" id="customer" placeholder="Customer name (optional)">
      <button id="go">Extract from text</button>
      <button class="ghost" id="sample">Load sample</button>
      <span class="meta">or</span>
      <input type="file" id="pdf" accept="application/pdf">
      <button class="ghost" id="gopdf">Extract from PDF</button>
    </div>
    <div id="err"></div>
  </div>

  <div id="out" class="hide">
    <div class="card"><div id="summary"></div><div class="meta" id="mode"></div></div>
    <div class="card wrap"><table>
      <thead><tr><th>Category</th><th>Requirement</th><th>Confidence</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div class="card"><strong>Open questions</strong><ul id="qs"></ul></div>
    <div class="card"><div class="row" style="margin:0 0 8px"><strong>Checklist</strong><button class="ghost" id="copy">Copy</button></div><pre id="check"></pre></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const SAMPLE = "Customer wants 500 pieces of a pump housing in the first order.\nMaterial is stainless steel 304 with 120 mm outer diameter.\nDelivery is needed within 8 weeks of the purchase order.\nThe parts must follow ISO 9001 quality rules.";

function setBusy(b) { $("go").disabled = $("gopdf").disabled = b; }
function show(data) {
  $("err").textContent = "";
  $("out").classList.remove("hide");
  $("summary").textContent = data.summary;
  $("mode").textContent = "Mode: " + data.mode + (data.review_count ? " | " + data.review_count + " item(s) need review" : "");
  const rows = $("rows"); rows.innerHTML = "";
  for (const r of data.requirements) {
    const tr = document.createElement("tr");
    const c1 = document.createElement("td"); const tag = document.createElement("span");
    tag.className = "tag"; tag.textContent = r.category; c1.appendChild(tag);
    const c2 = document.createElement("td"); c2.textContent = r.detail;
    const c3 = document.createElement("td"); c3.className = r.needs_review ? "flag" : "good";
    c3.textContent = Math.round(r.confidence * 100) + "%" + (r.needs_review ? " - check" : "");
    tr.append(c1, c2, c3); rows.appendChild(tr);
  }
  const qs = $("qs"); qs.innerHTML = "";
  for (const q of data.open_questions) { const li = document.createElement("li"); li.textContent = q; qs.appendChild(li); }
  if (!data.open_questions.length) { const li = document.createElement("li"); li.textContent = "None. Everything needed was found."; qs.appendChild(li); }
  $("check").textContent = data.checklist;
}
async function call(url, opts) {
  setBusy(true); $("err").textContent = "";
  try {
    const res = await fetch(url, opts); const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed (" + res.status + ")");
    show(data);
  } catch (e) { $("err").textContent = e.message; } finally { setBusy(false); }
}
$("go").onclick = () => call("/extract", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ text: $("text").value, customer: $("customer").value || null }) });
$("gopdf").onclick = () => {
  const f = $("pdf").files[0]; if (!f) { $("err").textContent = "Choose a PDF first."; return; }
  const fd = new FormData(); fd.append("file", f); if ($("customer").value) fd.append("customer", $("customer").value);
  call("/extract-pdf", { method: "POST", body: fd });
};
$("sample").onclick = () => { $("text").value = SAMPLE; };
$("copy").onclick = () => navigator.clipboard.writeText($("check").textContent);
</script>
</body>
</html>
